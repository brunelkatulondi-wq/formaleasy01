    <script>
      function decodeUtf8(base64) {
        const bin = atob(base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder("utf-8").decode(bytes);
      }

      function normalizeSource(source) {
        source = source.replace(/^\uFEFF/, "");
        source = source.replace(/[\u00A9\u00AB\u00BB\u00BC\u00BD\u00BE\u00BF\u20AC\uFFFD]/g, "");
        source = source.replace(
          /^\s*import\s+React\s*,\s*\{\s*useState\s*,\s*useEffect\s*,\s*useRef\s*\}\s*from\s*["']react["']\s*;?\s*$/m,
          "const { useState, useEffect, useRef } = React;"
        );
        source = source.replace(
          /\bexport\s+default\s+function\s+App\s*\(/,
          "function App("
        );
        return source + "\nwindow.__FormalEasyApp = App;";
      }

      function fail(error) {
        const loading = document.getElementById("loading");
        if (loading) loading.remove();
        const pre = document.createElement("pre");
        pre.id = "error";
        pre.textContent =
          "Le prototype n'a pas pu etre charge.\n\n" +
          (error && error.stack ? error.stack : String(error));
        document.body.appendChild(pre);
      }

      function startPrototype() {
        try {
          const scriptNode = document.getElementById("app-source");
          if (!scriptNode || !scriptNode.textContent) {
            throw new Error("Source JSX introuvable dans index.html");
          }

          const source = normalizeSource(decodeUtf8(scriptNode.textContent.trim()));
          const transformed = Babel.transform(source, {
            presets: ["react"],
            sourceType: "script"
          });

          new Function(transformed.code)();
          if (typeof window.__FormalEasyApp !== "function") {
            throw new Error("Le composant App est introuvable apres compilation.");
          }

          const root = ReactDOM.createRoot(document.getElementById("root"));
          root.render(React.createElement(window.__FormalEasyApp));

          const loading = document.getElementById("loading");
          if (loading) loading.remove();
        } catch (error) {
          fail(error);
        }
      }
