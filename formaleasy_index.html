// ── TOAST NOTIFICATION SYSTEM ─────────────────────────────────
const ToastContext = React.createContext(null);
const useToast = () => React.useContext(ToastContext);

const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const add = (msg, type="success", duration=3200) => {
    const id = Date.now();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), duration);
  };
  const icons = { success:"check", error:"alert", info:"zap", warning:"alert" };
  const colors = {
    success:{ bg:"#0D1D45",border:"rgba(44,196,192,.4)",ic:B.teal,text:B.white },
    error:  { bg:"#2d0808",border:"rgba(255,0,0,.4)",  ic:B.red, text:"#ffaaaa" },
    info:   { bg:"#0D1D45",border:`rgba(44,196,192,.3)`,ic:B.teal,text:B.white },
    warning:{ bg:"#2a1800",border:"rgba(255,150,0,.4)",ic:"#E67E00",text:"#ffd0a0" },
  };
  return (
    <ToastContext.Provider value={add}>
      {children}
      <div className="fe-toast">
        {toasts.map(t=>{
          const c=colors[t.type]||colors.info;
          return (
            <div key={t.id} className="fe-toast-item" style={{ background:c.bg,border:`1px solid ${c.border}`,color:c.text }}>
              <Ic n={icons[t.type]} size={15} color={c.ic} sw={2.5}/>
              <span style={{ flex:1,lineHeight:1.5 }}>{t.msg}</span>
              <div onClick={()=>setToasts(t2=>t2.filter(x=>x.id!==t.id))} style={{ cursor:"pointer",opacity:.5,flexShrink:0 }}><Ic n="close" size={13} color={c.text}/></div>
            </div>
          );
        })}
      </div>
    </ToastContext.Provider>
  );
};

const useClock = () => {
  const [time, setTime] = useState(()=>new Date());
  useEffect(()=>{ const t=setInterval(()=>setTime(new Date()),1000); return()=>clearInterval(t); },[]);

};

// ── PASSWORD STRENGTH ─────────────────────────────────────────
const PwdStrength = ({ pw }) => {
  if (!pw) return null;
  const score = [/.{8,}/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r=>r.test(pw)).length;
  const levels = [{ c:"#FF0000",l:"Très faible" },{ c:"#E67E00",l:"Faible" },{ c:"#f1c40f",l:"Moyen" },{ c:"#2CC4C0",l:"Fort" }];
  const lv = levels[Math.max(0,score-1)];
  return (
    <div style={{ marginTop:6 }}>
      <div style={{ display:"flex",gap:4,marginBottom:4 }}>
        {[1,2,3,4].map(i=>(
          <div key={i} style={{ flex:1,height:3,borderRadius:2,background:i<=score?lv.c:"#E4E8F0",transition:"background .3s" }}/>
        ))}
      </div>
      <div style={{ fontSize:10.5,color:lv.c,fontWeight:600,letterSpacing:.3 }}>{lv.l}</div>
    </div>
  );
};

const AnimBar = ({ value, max, color }) => {
  const [w, setW] = useState(0);
  useEffect(() => { const t = setTimeout(() => setW((value/max)*100), 400); return () => clearTimeout(t); }, [value, max]);
  return <div style={{ flex:1,height:8,background:B.g100,borderRadius:4,overflow:"hidden" }}><div style={{ height:"100%",width:`${w}%`,background:color,borderRadius:4,transition:"width 1.2s ease" }}/></div>;
};

const Counter = ({ target, suffix = "" }) => {
  const [v, setV] = useState(0); const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { let s=0; const step=target/50; const t=setInterval(()=>{ s+=step; if(s>=target){setV(target);clearInterval(t);}else setV(Math.floor(s)); },18); obs.disconnect(); }
    }, {threshold:.5});
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [target]);
  return <span ref={ref}>{v}{suffix}</span>;
};

const useReveal = () => {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("vis"); }), {threshold:.1});
    document.querySelectorAll(".reveal").forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
};

  );

    const e = {};

    return Object.keys(e).length===0;
  };

const GenerationPage = ({ setPage }) => {
  const [done, setDone] = useState(false);

  const [cur, setCur] = useState(0);
  useEffect(() => {
    const t = setInterval(() => {
      setProg(p => { if(p>=100){clearInterval(t);setDone(true);return 100;} return p+2; });
      setCur(c => Math.min(c, steps.length-1));

    return () => clearInterval(t);
  }, []);
  useEffect(() => { setCur(Math.floor(prog/20)); }, [prog]);

    <div style={{ background:B.navy,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 24px",cursor:"none" }}>

            <div style={{ fontSize:13.5,color:B.teal,marginBottom:24 }}>{prog}%</div>
            <div style={{ display:"flex",flexDirection:"column",gap:8 }}>

          <div style={{ animation:"fadeUp .6s ease" }}>
            <div style={{ width:80,height:80,borderRadius:"50%",background:`rgba(74,222,128,.1)`,border:"2px solid #4ade80",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 24px" }}>

            <p style={{ fontSize:15,color:"rgba(255,255,255,.55)",marginBottom:32,lineHeight:1.7 }}>Vos statuts OHADA ont été générés et soumis à notre juriste pour validation. Vous recevrez une confirmation sous 1 heure.</p>

                <span style={{ fontSize:12.5,color:c.ok?B.g600:B.red,fontWeight:c.ok?400:600 }}>{c.l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Row 7: Pipeline prévisionnel */}
      <div style={{ background:B.white,borderRadius:10,border:`1.5px solid ${B.g100}`,overflow:"hidden",marginTop:14 }}>
        <div style={{ padding:"14px 20px",borderBottom:`1px solid ${B.g100}`,display:"flex",alignItems:"center",justifyContent:"space-between" }}>
          <div style={{ display:"flex",alignItems:"center",gap:8 }}>
            <Ic n="file" size={15} color={B.navy} sw={2}/>
            <span style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:B.navy }}>Pipeline commercial prévisionnel — Avril 2026</span>
          </div>
          <div style={{ display:"flex",gap:8 }}>
            <span style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:B.g400 }}>Leads en cours :</span>
            <span style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,color:B.teal }}>11</span>
            <span style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,color:B.g400 }}>· CA potentiel :</span>
            <span style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:900,color:"#0A7A52" }}>3 600 $</span>
          </div>
        </div>
        <div style={{ padding:20,display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12 }}>
          {[
            { stage:"Prospect", n:6, ca:"n/d",     c:B.g200,  bg:B.off, note:"À qualifier" },
            { stage:"Qualifié",  n:3, ca:"1 047 $", c:"#60a5fa",bg:"#eff6ff",note:"Envoi devis" },
            { stage:"Devis",     n:2, ca:"698 $",   c:"#e67e00",bg:"#fff7ed",note:"En attente paiement" },
            { stage:"Paiement",  n:0, ca:"0 $",     c:B.g400,  bg:B.off, note:"File vide" },
            { stage:"Traitement",n:7, ca:"2 096 $", c:B.teal,  bg:`rgba(44,196,192,.05)`,note:"Dossiers actifs" },
          ].map((s,i)=>(
            <div key={i} style={{ padding:"14px 16px",background:s.bg,borderRadius:8,border:`1px solid ${s.c}30`,textAlign:"center" }}>
              <div style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:800,color:s.c,textTransform:"uppercase",letterSpacing:1,marginBottom:8 }}>{s.stage}</div>
              <div style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:36,fontWeight:900,color:B.navy,lineHeight:1 }}>{s.n}</div>
              <div style={{ fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:700,color:s.c,marginTop:4 }}>{s.ca}</div>
              <div style={{ fontSize:10.5,color:B.g400,marginTop:6 }}>{s.note}</div>
            </div>
          ))}
        </div>
        <div style={{ padding:"12px 20px",borderTop:`1px solid ${B.g100}`,background:`rgba(44,196,192,.03)`,display:"flex",gap:24 }}>
          <div style={{ fontSize:12,color:B.g600 }}>📊 <strong style={{ color:B.navy }}>Conversion estimée avril :</strong> 5–7 dossiers · CA projeté : <strong style={{ color:"#0A7A52" }}>2 500 – 3 600 $</strong></div>
          <div style={{ fontSize:12,color:B.g600 }}>🎯 <strong style={{ color:B.navy }}>Action prioritaire :</strong> relancer les 2 devis en attente de paiement</div>
        </div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════
//  ROOT ROUTER — avec authentification complète
// ══════════════════════════════════════════════════════════════
function App() {
  // ── auth state ──
  const [clientUser, setClientUser]   = useState(null);
  const [adminUser,  setAdminUser]    = useState(null);

  // ── navigation state ──
  const [appMode, setAppMode]   = useState("site");
  const [sitePage, setSitePage] = useState("home");
  const [authIntent, setAuthIntent] = useState("questionnaire");

  // ── scroll to top on page change ──
  useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [sitePage, appMode]);

  // ── route protection ──
  const PROTECTED_CLIENT = ["questionnaire","generation","dashboard-client"];

  const handleSitePage = (p) => {
    if (PROTECTED_CLIENT.includes(p) && !clientUser) {
      setAuthIntent(p);
      setAppMode("client-auth");
    } else {
      setSitePage(p);
    }
  };

  const handleClientAuth = (user) => {
    setClientUser(user);
    setAppMode("site");
    setSitePage(authIntent);
  };

  const handleAdminAuth = (user) => {
    setAdminUser(user);
    setAppMode("admin");
  };

  const handleAdminLogout = () => {
    setAdminUser(null);
    setAppMode("site");
    setSitePage("home");
  };

  const handleClientLogout = () => {
    setClientUser(null);
    setSitePage("home");
  };

  // ── Admin login ──
  if (appMode === "admin-login") return (
    <ToastProvider>
      <GlobalStyle/>
      <AdminLoginPage onAuth={handleAdminAuth} onBack={()=>setAppMode("site")}/>
    </ToastProvider>
  );

  if (appMode === "client-auth") return (
    <ToastProvider>
      <GlobalStyle/>
      <style>{`body { background: ${B.navy}; cursor: none; }`}</style>
      <Cursor/>
      <ClientAuthPage onAuth={handleClientAuth} onBack={()=>setAppMode("site")} intent={authIntent}/>
    </ToastProvider>
  );

  if (appMode === "admin") {
    if (!adminUser) { setAppMode("admin-login"); return null; }
    return (
      <ToastProvider>
        <GlobalStyle/>
        <AdminApp
          adminUser={adminUser}
          onLogout={handleAdminLogout}
          goSite={()=>{ setAppMode("site"); setSitePage("home"); }}
        />
      </ToastProvider>
    );
  }

  // ── Public site ──
  const noFooter = ["questionnaire","generation","dashboard-client"];
  const pages = {
    home:              <HomePage setPage={handleSitePage}/>,
    process:           <ProcessPage setPage={handleSitePage}/>,
    pricing:           <PricingPage setPage={handleSitePage}/>,
    questionnaire:     <QuestionnairePage setPage={handleSitePage}/>,
    generation:        <GenerationPage setPage={handleSitePage}/>,
    "dashboard-client":<ClientDashboard setPage={handleSitePage}/>,
    about:             <AboutPage setPage={handleSitePage}/>,
    faq:               <FaqPage setPage={handleSitePage}/>,
  };

  return (
    <ToastProvider>
      <GlobalStyle/>
      <style>{`body { background: ${B.navy}; cursor: none; }`}</style>
      <Cursor/>
      <SiteNav
        page={sitePage}
        setPage={handleSitePage}
        goAdmin={()=>setAppMode("admin-login")}
        clientUser={clientUser}
        onClientLogout={handleClientLogout}
      />
      <div style={{ overflowX:"hidden" }}>
        {pages[sitePage] || <HomePage setPage={handleSitePage}/>}
        {!noFooter.includes(sitePage) && <SiteFooter setPage={handleSitePage}/>}
      </div>
      <Chatbot setPage={handleSitePage}/>
    </ToastProvider>
  );
}



ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
